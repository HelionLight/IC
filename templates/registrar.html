<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuário</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"/>
</head>
<body>
    <div class="header">
        <div class="logo">IC</div>
        <div class="nav">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>
        <div class="search">
            <input type="text" placeholder="Pesquisar no Site"/>
            <i class="fas fa-search"></i>
        </div>
    </div>

    <div class="container">
        <div class="form-section">
            <div>
                <div class="form-title">Registro de Usuário</div>
                <div class="form-subtitle">Escolha seu tipo de conta</div>
            </div>
            <div class="form">
                <div class="buttons">
                    <button type="button" onclick="window.location.href='{{ url_for('registrar_aluno') }}'">Registrar como Aluno</button>
                    <button type="button" onclick="window.location.href='{{ url_for('registrar_administrador') }}'">Registrar como Administrador</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

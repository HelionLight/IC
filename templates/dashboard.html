<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IC - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <div class="logo">IC</div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="#">Sobre</a>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="#">Contatos</a>
        </div>
        <div class="search">
            <input type="text" placeholder="Pesquisar no site">
            <i class="fas fa-search"></i>
        </div>
    </div>

    <div class="content">
        <h1>Dashboard</h1>
        <h2>Lista de Usuários</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for usuario in usuarios %}
                <tr>
                    <td>{{ usuario.id }}</td>  <!-- ID do usuário -->
                    <td>{{ usuario.nome }}</td>  <!-- Nome do usuário -->
                    <td>{{ usuario.email }}</td>  <!-- Email do usuário -->
                    <td>
                        <a href="{{ url_for('editar_usuario', user_id=usuario.id) }}">Editar</a>
                        <a href="{{ url_for('excluir_usuario', user_id=usuario.id) }}" onclick="return confirm('Tem certeza que deseja excluir este usuário?');">Excluir</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <h2>Progresso Feito</h2>
        <div class="charts">
            <div class="chart">
                <img src="{{ url_for('static', filename='images/pie-chart.jpg') }}" alt="Gráfico de pizza mostrando progresso" width="240" height="240">
                <p>Pizza</p>
            </div>
            <div class="chart">
                <img src="{{ url_for('static', filename='images/bar-chart.jpg') }}" alt="Gráfico de barras mostrando progresso" width="240" height="240">
                <p>Barras</p>
            </div>
        </div>

        <h2>Imagens & Status do Treinamento</h2>

    </div>
</body>
</html>
